<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapCut · interno</title>
<style>
  :root {
    --fundo: #ffffff; --fundo-2: #f7f7f8; --borda: #e5e5e5;
    --texto: #1d1d1f; --texto-2: #6b6b70;
    --acao: #1d1d1f; --acao-texto: #ffffff;
    --ok: #0a7c42; --erro: #b3261e; --aviso: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #1b1b1d; --fundo-2: #242427; --borda: #35353a;
      --texto: #f2f2f3; --texto-2: #9a9aa0;
      --acao: #f2f2f3; --acao-texto: #1b1b1d;
      --ok: #4ade80; --erro: #ff8a80; --aviso: #e0b155;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--borda);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .pilula {
    font-size: 11.5px; padding: 3px 9px; border-radius: 99px;
    background: var(--fundo-2); border: 1px solid var(--borda); color: var(--texto-2);
  }
  .pilula.bom { color: var(--ok); } .pilula.ruim { color: var(--erro); }
  .dir { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  main { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 22px 20px 40px; }
  h2 { font-size: 14px; font-weight: 600; margin: 26px 0 10px; }
  h2:first-child { margin-top: 0; }
  p.sub { color: var(--texto-2); font-size: 13.5px; margin: 0 0 14px; }

  .maquina {
    border: 1px solid var(--borda); background: var(--fundo-2);
    border-radius: 11px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  }
  .maquina.sel { border-color: var(--texto); }
  .maquina .topo { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .maquina .nome { font-weight: 600; font-size: 14px; }
  .maquina .det { color: var(--texto-2); font-size: 12.5px; margin-top: 5px; }

  select, textarea, input {
    width: 100%; font: inherit; font-size: 14px; padding: 10px 12px;
    border: 1px solid var(--borda); border-radius: 10px;
    background: var(--fundo-2); color: var(--texto);
  }
  textarea { resize: vertical; min-height: 78px; }
  label { display: block; font-size: 12px; color: var(--texto-2); margin: 12px 0 5px; }
  .botoes { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; cursor: pointer; border-radius: 9px;
    padding: 10px 16px; border: 1px solid var(--borda);
    background: var(--fundo-2); color: var(--texto);
  }
  button.principal { background: var(--acao); color: var(--acao-texto); border-color: var(--acao); }
  button:disabled { opacity: .45; cursor: default; }

  .passo {
    display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap;
    font-size: 13.5px; padding: 7px 12px; margin-bottom: 7px;
    background: var(--fundo-2); border: 1px solid var(--borda); border-radius: 9px;
  }
  .passo .nome { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; flex: 0 0 auto; }
  .passo .det { color: var(--texto-2); word-break: break-word; flex: 1 1 55%; min-width: 0; }
  .passo .ms { margin-left: auto; color: var(--texto-2); font-size: 11.5px; flex: 0 0 auto; }
  .passo.falhou { border-color: var(--erro); } .passo.falhou .det { color: var(--erro); }
  .avisos { font-size: 11.5px; color: var(--aviso); padding-left: 12px; margin-bottom: 7px; }
  .texto { white-space: pre-wrap; margin: 10px 0; }
  .falha { color: var(--erro); font-size: 13.5px; margin: 10px 0; }
  .gasto { font-size: 11.5px; color: var(--texto-2); }
  details { font-size: 13px; color: var(--texto-2); margin-bottom: 7px; }
  details .corpo { white-space: pre-wrap; padding-top: 6px; }
  .vazio { color: var(--texto-2); font-size: 13.5px; border: 1px dashed var(--borda);
           border-radius: 11px; padding: 20px; text-align: center; }
  code { background: var(--fundo-2); border: 1px solid var(--borda); border-radius: 4px;
         padding: 1px 5px; font-size: 12.5px; word-break: break-all; }
  pre { background: var(--fundo-2); border: 1px solid var(--borda); border-radius: 9px;
        padding: 12px; font-size: 12px; overflow-x: auto; }
  @media (max-width: 560px) {
    .passo { flex-direction: column; align-items: stretch; gap: 3px; }
    .passo .ms { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>CapCut · interno</h1>
  <div class="dir" id="pilulas"></div>
</header>

<main>
  <div id="porta">
    <h2>Código de acesso</h2>
    <p class="sub">Este painel enfileira trabalho que <b>executa no Mac de alguém</b>.
       Por isso ele é fechado.</p>
    <input id="codigo" type="password" placeholder="código interno" autocomplete="off">
    <div class="botoes"><button class="principal" id="entrar">Entrar</button></div>
    <div class="falha" id="portaErro"></div>
  </div>

  <div id="painel" hidden>
    <h2>Máquinas</h2>
    <p class="sub">Cada máquina roda o motor e fala com este painel de saída.
       O vídeo não passa por aqui.</p>
    <div id="maquinas"></div>

    <div id="pedido" hidden>
      <h2>O que fazer</h2>
      <label for="fonte">Vídeo na pasta de entrada da máquina</label>
      <select id="fonte"></select>
      <label for="prompt">Pedido</label>
      <textarea id="prompt" placeholder="Corte os 3 melhores momentos e legende tudo"></textarea>
      <div class="botoes">
        <button class="principal" id="enviar">Enviar para a máquina</button>
        <button id="diag">Só diagnosticar</button>
      </div>
      <div class="falha" id="pedidoErro"></div>
    </div>

    <div id="acomp" hidden>
      <h2>Andamento <span class="pilula" id="estadoJob"></span></h2>
      <div id="eventos"></div>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let CODIGO = localStorage.getItem("capcut_ui_code") || "";
let maquinaSel = null, jobAtual = null, ultimoEvento = 0, relogio = null;

function el(t, c, x) { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; }

async function api(rota, opcoes) {
  const o = Object.assign({}, opcoes || {});
  o.headers = Object.assign({ "X-UI-Code": CODIGO }, o.headers || {});
  const r = await fetch(rota, o);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.erro || ("HTTP " + r.status)), j);
  return j;
}

// ------------------------------------------------------------------ porta
$("#entrar").onclick = entra;
$("#codigo").addEventListener("keydown", e => { if (e.key === "Enter") entra(); });
if (CODIGO) { $("#codigo").value = CODIGO; entra(true); }

async function entra(silencioso) {
  CODIGO = $("#codigo").value.trim();
  $("#portaErro").textContent = "";
  if (!CODIGO) { $("#portaErro").textContent = "Informe o código."; return; }
  try {
    await api("/api/maquinas");
    localStorage.setItem("capcut_ui_code", CODIGO);
    $("#porta").hidden = true; $("#painel").hidden = false;
    saude(); listaMaquinas(); setInterval(listaMaquinas, 5000);
  } catch (e) {
    if (!silencioso || !e.precisa_codigo) $("#portaErro").textContent = e.message;
  }
}

async function saude() {
  try {
    const s = await fetch("/api/saude").then(r => r.json());
    const p = $("#pilulas"); p.innerHTML = "";
    const add = (t, c) => p.appendChild(el("span", "pilula " + (c || ""), t));
    add(s.banco ? "banco conectado" : "banco desligado", s.banco ? "bom" : "ruim");
    if (!s.ui_code) add("CAPCUT_UI_CODE ausente", "ruim");
    if (!s.banco && s.erro_banco) {
      const d = el("div", "falha", s.erro_banco);
      $("#maquinas").appendChild(d);
    }
  } catch (e) {}
}

// --------------------------------------------------------------- máquinas
async function listaMaquinas() {
  let d;
  try { d = await api("/api/maquinas"); } catch (e) { return; }
  const caixa = $("#maquinas");
  if (!d.maquinas.length) {
    caixa.innerHTML = "";
    const v = el("div", "vazio");
    v.innerHTML = "Nenhuma máquina apareceu ainda.<br><br>" +
      "Rode o motor num Mac com o CapCut:<br>" +
      "<pre>CAPCUT_RELAY=" + location.origin + " \\\n" +
      "CAPCUT_MAQUINA=meu-mac \\\n" +
      "CAPCUT_RELAY_TOKEN=um-segredo-de-24-ou-mais \\\n" +
      "  PYTHONPATH=src ./.venv/bin/python web/relay.py</pre>";
    caixa.appendChild(v);
    $("#pedido").hidden = true;
    return;
  }
  caixa.innerHTML = "";
  d.maquinas.forEach(m => {
    const c = el("div", "maquina" + (m.nome === maquinaSel ? " sel" : ""));
    const topo = el("div", "topo");
    topo.appendChild(el("span", "nome", m.nome));
    topo.appendChild(el("span", "pilula " + (m.online ? "bom" : "ruim"),
      m.online ? "online" : "visto há " + m.visto_ha_s + "s"));
    const e = m.estado || {};
    if (e.capcut) topo.appendChild(el("span", "pilula", "CapCut " + e.capcut));
    if (!e.api_key) topo.appendChild(el("span", "pilula ruim", "sem API key"));
    if (typeof e.disco_gib === "number")
      topo.appendChild(el("span", "pilula", e.disco_gib.toFixed(1) + " GiB"));
    c.appendChild(topo);
    c.appendChild(el("div", "det",
      (m.inventario || []).length + " arquivo(s) em " + (e.entrada || "?")));
    c.onclick = () => { maquinaSel = m.nome; desenhaPedido(m); listaMaquinas(); };
    caixa.appendChild(c);
  });
  const sel = d.maquinas.find(m => m.nome === maquinaSel);
  if (sel) desenhaPedido(sel);
}

function desenhaPedido(m) {
  $("#pedido").hidden = false;
  const s = $("#fonte");
  const antes = s.value;
  s.innerHTML = "";
  s.appendChild(new Option("(nenhum — só texto)", ""));
  (m.inventario || []).forEach(a => {
    const dur = a.duracao_s ? " · " + a.duracao_s.toFixed(0) + "s" : "";
    const mb = " · " + (a.bytes / 1048576).toFixed(1) + " MB";
    const semAudio = a.tem_audio === false ? " · SEM áudio" : "";
    s.appendChild(new Option(a.nome + dur + mb + semAudio, a.caminho));
  });
  if (antes) s.value = antes;
}

// ------------------------------------------------------------------ jobs
$("#enviar").onclick = () => manda("agente");
$("#diag").onclick = () => manda("diagnostico");

async function manda(tipo) {
  $("#pedidoErro").textContent = "";
  $("#enviar").disabled = $("#diag").disabled = true;
  try {
    const j = await api("/api/job", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ maquina: maquinaSel, tipo: tipo,
        prompt: $("#prompt").value.trim(), fonte: $("#fonte").value || null }),
    });
    jobAtual = j.job_id; ultimoEvento = 0;
    $("#eventos").innerHTML = ""; $("#acomp").hidden = false;
    $("#estadoJob").textContent = "pendente";
    if (relogio) clearInterval(relogio);
    relogio = setInterval(puxa, 1500);
    puxa();
  } catch (e) {
    $("#pedidoErro").textContent = e.message;
  }
  $("#enviar").disabled = $("#diag").disabled = false;
}

async function puxa() {
  if (!jobAtual) return;
  let d;
  try { d = await api("/api/job/" + jobAtual + "?depois=" + ultimoEvento); }
  catch (e) { return; }
  $("#estadoJob").textContent = d.estado;
  $("#estadoJob").className = "pilula " +
    (d.estado === "ok" ? "bom" : d.estado === "erro" ? "ruim" : "");
  d.eventos.forEach(pinta);
  ultimoEvento = d.ultimo;
  if (d.estado === "ok" || d.estado === "erro") { clearInterval(relogio); relogio = null; }
}

const pendentes = new Map();

function pinta(ev) {
  const caixa = $("#eventos");
  if (ev.tipo === "pensando") {
    const d = el("details"); d.appendChild(el("summary", null, "raciocínio"));
    d.appendChild(el("div", "corpo", ev.texto)); caixa.appendChild(d);
  } else if (ev.tipo === "texto") {
    caixa.appendChild(el("div", "texto", ev.texto));
  } else if (ev.tipo === "tool_inicio") {
    const p = el("div", "passo");
    p.appendChild(el("span", "nome", ev.nome));
    p.appendChild(el("span", "det", "…"));
    caixa.appendChild(p); pendentes.set(ev.nome, p);
  } else if (ev.tipo === "tool_fim") {
    const p = pendentes.get(ev.nome) || caixa.appendChild(el("div", "passo"));
    pendentes.delete(ev.nome);
    p.innerHTML = ""; p.className = "passo" + (ev.ok ? "" : " falhou");
    p.appendChild(el("span", "nome", ev.nome));
    p.appendChild(el("span", "det", ev.resumo || ""));
    if (ev.ms !== undefined) p.appendChild(el("span", "ms", ev.ms + " ms"));
    if ((ev.avisos || []).length)
      caixa.appendChild(el("div", "avisos", "⚠ " + ev.avisos.join(" · ")));
  } else if (ev.tipo === "erro") {
    caixa.appendChild(el("div", "falha", ev.texto));
  } else if (ev.tipo === "fim" && ev.gasto) {
    const g = ev.gasto;
    caixa.appendChild(el("div", "gasto",
      g.entrada + " tokens de entrada · " + g.saida + " de saída · " +
      g.cache_lido + " lidos do cache"));
  }
}
</script>
</body>
</html>
